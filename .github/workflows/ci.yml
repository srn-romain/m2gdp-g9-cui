name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: public/package-lock.json }
      - run: npm ci
        working-directory: public
      - run: npm run type-check
        working-directory: public
      - run: npm run build
        working-directory: public
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: workers/package-lock.json }
      - run: npm ci
        working-directory: workers
      - run: npm run type-check
        working-directory: workers
      - run: npm test
        working-directory: workers
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: tests/package-lock.json }
      - run: npm ci
        working-directory: tests
      - run: npm ci
        working-directory: public
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - run: npm run e2e:ui
        working-directory: tests
